<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBF8F3">
<meta name="color-scheme" content="light">
<meta name="description" content="رحلتي نحو الالتزام — متابعة العادات اليومية بلطف">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="رحلتي">
<title>رحلتي نحو الالتزام</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <main id="view" tabindex="-1"></main>
</div>

<nav class="tabbar" aria-label="التنقل الرئيسي">
  <a href="#home" data-tab="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5V19a1.5 1.5 0 0 1-1.5 1.5H15v-5h-6v5H5.5A1.5 1.5 0 0 1 4 19z"/></svg>
    <span>الرئيسية</span>
  </a>
  <a href="#stats" data-tab="stats">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>
    <span>الإحصائيات</span>
  </a>
  <a href="#calendar" data-tab="calendar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="15" rx="3"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg>
    <span>التقويم</span>
  </a>
</nav>

<div class="sheet-wrap" id="sheet" hidden>
  <div class="sheet-backdrop" data-close-sheet></div>
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="petals" id="petals" aria-hidden="true"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script src="app.js"></script>
</body>
</html>
