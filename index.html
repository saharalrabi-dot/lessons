<section class="slide cover" data-stage="review" data-title="الغلاف"><div class="cover-art"><svg viewBox="0 0 240 180" role="img" aria-label="التخزين السحابي" xmlns="http://www.w3.org/2000/svg"><path d="M60 80 q-30 0 -30 -26 q0 -26 30 -24 q10 -24 40 -20 q24 -24 52 0 q32 -6 36 24 q30 2 28 24 q-2 22 -30 22z" fill="#2F80ED"/><path d="M110 60 v-22 l-10 10 M110 38 l10 10" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M60 92 v30 M120 92 v24 M180 92 v30" stroke="#1E2142" stroke-width="3" stroke-dasharray="5 5"/><rect x="38" y="122" width="44" height="32" rx="4" fill="#E5337A"/><rect x="104" y="116" width="32" height="44" rx="5" fill="#1FB58F"/><rect x="158" y="122" width="44" height="32" rx="4" fill="#F7B32B"/><rect x="44" y="128" width="32" height="20" fill="#FFFFFF"/><rect x="164" y="128" width="32" height="20" fill="#FFFFFF"/><rect x="109" y="122" width="22" height="30" fill="#FFFFFF"/></svg></div><span class="kicker">الحصة الثالثة من ثلاث حصص</span><h1>تقنية المعلومات والاتصالات والمجتمع</h1><div class="meta"><span>تابع الدرس الخامس</span><span>الوحدة الأولى: أساسيات علم الحاسب</span><span>الكتاب ص62</span></div><div class="plan"><span>مراجعة: عجلة الأسئلة</span><span>نشاط: أوافق أم لا أوافق؟</span><span>الأهداف</span><span>الشرح</span><span>لعبة جسر الفجوة</span></div></section><section class="slide" data-stage="review" data-title="مراجعة: عجلة الأسئلة" data-time="300"><div class="tags"><span class="tag st">استراتيجية: العجلة الدوارة (الاختيار العشوائي)</span><span class="tag ev">تقويم تشخيصي</span><span class="tag tm">5 دقائق • فردي</span></div><h2>مراجعة الحصة السابقة<small>أديري العجلة، وتجيب الطالبة عن السؤال الذي يظهر</small></h2><div class="wheel-wrap" data-wheel="wh3"><div class="wheel-box"><div class="pin"></div><div class="wheel"></div></div><div style="flex:1;min-width:min(100%,18rem);display:flex;flex-direction:column;gap:1rem"><div><button class="btn" data-spin>أديري العجلة</button></div><div class="stagebox" hidden></div></div></div></section><section class="slide" data-stage="warm" data-title="نشاط تمهيدي: أوافق أم لا أوافق؟" data-time="180"><div class="tags"><span class="tag st">استراتيجية: دليل الترقب</span><span class="tag ev">تقويم تشخيصي</span><span class="tag tm">3 دقائق • جماعي</span></div><h2>أوافق أم لا أوافق؟<small>صوّتي برفع اليد، وسجّلي رأي أغلبية الصف. سنعود لهذه العبارات في نهاية الحصة!</small></h2><div class="scroll-x"><table class="guide"><tr><th>العبارة</th><th>رأي الصف</th></tr><tr><td>كل شخص لديه إمكانية استخدام أجهزة الحاسب والإنترنت والاستفادة من التقنية.</td><td><div class="yn" data-k="g1"><button data-v="y">أوافق</button><button data-v="n">لا أوافق</button></div></td></tr><tr><td>توجد طرق لحفظ نسخة احتياطية من ملفاتي على الإنترنت.</td><td><div class="yn" data-k="g2"><button data-v="y">أوافق</button><button data-v="n">لا أوافق</button></div></td></tr><tr><td>عدم مشاركة ملفاتي على الإنترنت يكفي لحماية خصوصيتي.</td><td><div class="yn" data-k="g3"><button data-v="y">أوافق</button><button data-v="n">لا أوافق</button></div></td></tr><tr><td>ينقسم المجتمع إلى فئتين فقط: فئة قادرة على استخدام التقنية وأخرى غير قادرة.</td><td><div class="yn" data-k="g4"><button data-v="y">أوافق</button><button data-v="n">لا أوافق</button></div></td></tr><tr><td>اللغة تؤثر في كمّ وجودة المعلومات التي أصل إليها عبر الإنترنت.</td><td><div class="yn" data-k="g5"><button data-v="y">أوافق</button><button data-v="n">لا أوافق</button></div></td></tr></table></div></section><section class="slide" data-stage="goals" data-title="عنوان الدرس وأهداف الحصة"><span class="note">الدرس الخامس • الحصة الثالثة</span><h1 class="lesson-title">تقنية المعلومات والاتصالات والمجتمع</h1><h2 style="font-size:1.3em">أهداف الحصة الثالثة</h2><ol class="goals"><li>التعرف على خدمة التخزين السحابي.</li><li>معرفة مفهوم الفجوة الرقمية.</li><li>معرفة العوامل المؤثرة على الفجوة الرقمية.</li></ol></section><section class="slide" data-stage="learn" data-title="ما هو التخزين السحابي؟"><div class="tags"><span class="tag st">استراتيجية: الاستنتاج والعرض المباشر</span><span class="tag bk">الكتاب ص62</span></div><div class="split"><div class="txt"><h2>التخزين السحابي</h2><div class="panel hl"><h3>استنتجي أولاً ☁️</h3><p>لماذا برأيك سُمّيت هذه الخدمة «سحابية»؟ ناقشي زميلتك ثم شاركي الصف.</p></div><div class="answer" style="font-size:1.12em">تتيح خدمات <b>التخزين السحابي</b><span dir="ltr">(Cloud Storage)</span> الاحتفاظ بنسخ احتياطية من ملفاتك عبر الإنترنت والوصول إليها من أي مكان بمجرد الاتصال بالإنترنت.</div></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="التخزين السحابي" xmlns="http://www.w3.org/2000/svg"><path d="M60 80 q-30 0 -30 -26 q0 -26 30 -24 q10 -24 40 -20 q24 -24 52 0 q32 -6 36 24 q30 2 28 24 q-2 22 -30 22z" fill="#2F80ED"/><path d="M110 60 v-22 l-10 10 M110 38 l10 10" stroke="#FFFFFF" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M60 92 v30 M120 92 v24 M180 92 v30" stroke="#1E2142" stroke-width="3" stroke-dasharray="5 5"/><rect x="38" y="122" width="44" height="32" rx="4" fill="#E5337A"/><rect x="104" y="116" width="32" height="44" rx="5" fill="#1FB58F"/><rect x="158" y="122" width="44" height="32" rx="4" fill="#F7B32B"/><rect x="44" y="128" width="32" height="20" fill="#FFFFFF"/><rect x="164" y="128" width="32" height="20" fill="#FFFFFF"/><rect x="109" y="122" width="22" height="30" fill="#FFFFFF"/></svg></div></div><h3 style="font-size:1.1em">أمثلة لمقدّمي خدمة التخزين السحابي</h3><div class="grid" dir="ltr" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr))"><div class="panel"><h3>Google Drive</h3></div><div class="panel"><h3>Dropbox</h3></div><div class="panel"><h3>OneDrive</h3></div><div class="panel"><h3>iCloud</h3></div><div class="panel"><h3>pCloud</h3></div><div class="panel"><h3>IDrive</h3></div><div class="panel"><h3>MEGA</h3></div><div class="panel"><h3>Firefox Send</h3></div></div></section><section class="slide" data-stage="learn" data-title="التخزين السحابي والخصوصية" data-time="180"><div class="tags"><span class="tag st">استراتيجية: الحوار والمناقشة + القراءة الفعالة</span><span class="tag ev">تقويم تكويني</span><span class="tag bk">الكتاب ص62</span><span class="tag tm">3 دقائق</span></div><h2>يعتقد الكثيرون أن عدم مشاركتهم على الإنترنت وتجنب إتاحة المحتوى للجمهور يكفيان لحماية خصوصيتهم.. ما رأيك؟</h2><p class="lead">قد يكون هذا صحيحاً في معظم الحالات، ولكن يجب ألا ننسى:</p><div class="grid two"><div class="panel neg"><p>عند استخدام الخدمات السحابية تصبح ملفاتك الشخصية بحوزة الشركات الخاصة بالاستضافة السحابية التي بدورها تخبرك بقواعدها في احترام خصوصيتك أو عدم الاطلاع على ملفاتك الشخصية. ومن المؤسف أنه يمكنهم في الواقع القيام بذلك، حيث تتعلق هذه المسألة بالثقة فقط.</p></div><div class="panel neg"><p>العديد من كبار مزودي خدمات التخزين السحابي يتفحصون ملفاتك تلقائياً لاكتشاف أي محتوى غير قانوني مثل الصوتيات أو الأفلام التي تم تنزيلها من الإنترنت، وذلك لإزالتها أو حتى لإبلاغ السلطات.</p></div></div><div class="book"><span class="ico">ص62</span><p>اقرئي آخر فقرة التخزين السحابي في الكتاب <b>صفحة 62</b> وأكملي: لذلك يُنصح عند استخدامك للتخزين السحابي أن ........................ وأن ........................</p></div><div><button class="btn soft" data-reveal="priv-a">أظهري الإجابة</button></div><div class="answer" id="priv-a" hidden>تتجنب تحميل أي معلومات شخصية حساسة، وأن تحتفظ دائماً بنسخة احتياطية من ملفاتك على محرك قرص صلب في منزلك.</div></section><section class="slide" data-stage="learn" data-title="ما الفجوة الرقمية؟"><div class="tags"><span class="tag st">استراتيجية: العرض المباشر</span><span class="tag bk">الكتاب ص63</span></div><div class="split"><div class="txt"><h2>ما الفجوة الرقمية؟</h2><div class="answer" style="font-size:1.12em">تُعدُّ الفجوة الرقمية أو التقنية <b>مشكلة اجتماعية</b>، وهي التفاوت في مقدار المعلومات والمهارات بين من يملك إمكانية الوصول لأجهزة الحاسب والإنترنت ومن ليس لديه إمكانية الوصول لذلك.</div><p class="lead">لا تقتصر هذه الفجوة بالضرورة على إمكانية الوصول للإنترنت فقط، بل لأوسع من ذلك لتشمل إمكانية الوصول إلى وسائل تقنية المعلومات والاتصالات وإلى الوسائط التي يمكن لشرائح المجتمع المختلفة استخدامها.</p></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="الفجوة الرقمية" xmlns="http://www.w3.org/2000/svg"><path d="M0 70 h85 l-6 110 h-79z" fill="#1FB58F"/><path d="M240 70 h-85 l6 110 h79z" fill="#2F80ED"/><path d="M85 70 q35 30 70 0" stroke="#FF7A45" stroke-width="4" fill="none"/><rect x="88" y="74" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="97" y="84" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="106" y="84" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="115" y="84" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="124" y="84" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="133" y="84" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="142" y="84" width="6" height="12" rx="2" fill="#F7B32B"/><rect x="151" y="74" width="6" height="12" rx="2" fill="#F7B32B"/><g transform="translate(40,18) scale(0.8)"><rect x="-16" y="18" width="32" height="40" rx="14" fill="#E5337A"/><circle cx="0" cy="6" r="13" fill="#F2C6A0"/><path d="M-14 4 Q-14 -10 0 -10 Q14 -10 14 4 Q10 -4 0 -4 Q-10 -4 -14 4Z" fill="#1E2142"/></g><g transform="translate(200,18) scale(0.8)"><rect x="-16" y="18" width="32" height="40" rx="14" fill="#8E5CF7"/><circle cx="0" cy="6" r="13" fill="#F2C6A0"/><path d="M-14 4 Q-14 -10 0 -10 Q14 -10 14 4 Q10 -4 0 -4 Q-10 -4 -14 4Z" fill="#1E2142"/></g><rect x="180" y="58" width="30" height="20" rx="3" fill="#1E2142"/><rect x="183" y="61" width="24" height="14" fill="#FFFFFF"/></svg></div></div><div class="panel"><h3>من الخطأ تقسيم المجتمع إلى فئتين فقط!</h3><p>من الخطأ تقسيم المجتمع حسب مفهوم الفجوة الرقمية إلى فئتين (فئة قادرة على استخدام التقنية وأخرى غير قادرة)، وإنما تتفاوت فئات المجتمع في قدرتها على الاستفادة من التقنية المتاحة، وذلك بحسب ما يلي:</p><div class="grid" style="margin-top:.7rem"><div class="panel"><p>وجود أجهزة الحاسب ذات الأداء أو الجودة المنخفضة.</p></div><div class="panel"><p>رداءة شبكات الاتصالات أو ارتفاع تكلفتها.</p></div><div class="panel"><p>صعوبة الحصول على التدريب والتعليم التقني والدعم.</p></div></div></div></section><section class="slide" data-stage="learn" data-title="العوامل المؤثرة على الفجوة الرقمية"><div class="tags"><span class="tag st">استراتيجية: الاستكشاف (اضغطي على كل عامل)</span><span class="tag bk">الكتاب ص63–64</span></div><h2>العوامل المؤثرة على الفجوة الرقمية<small>هناك العديد من العوامل التي تسهم في زيادة الفجوة الرقمية، ولا تقتصر هذه الصعوبات على بلد معين، بل إنها تتوسع لتشمل بلداناً بأكملها مما يجعل الفجوة الرقمية قضية عالمية. اضغطي على كل عامل لتكتشفي تفاصيله</small></h2><div class="art strip"><svg viewBox="0 0 240 180" role="img" aria-label="عوامل الفجوة الرقمية حول العالم" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="90" r="64" fill="#2F80ED"/><path d="M80 50 q20 10 18 30 q-2 18 -22 22 q-10 -20 4 -52z M130 40 q30 10 40 40 q-20 0 -30 -12 q-10 -14 -10 -28z M120 120 q20 -6 34 8 q-10 18 -30 22 q-10 -14 -4 -30z" fill="#1FB58F"/><ellipse cx="120" cy="90" rx="64" ry="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".7"/><path d="M120 26 v128" stroke="#FFFFFF" stroke-width="2" opacity=".7"/><rect x="10" y="20" width="44" height="30" rx="8" fill="#E5337A"/><text x="32" y="42" font-size="18" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">ع</text><rect x="186" y="20" width="44" height="30" rx="8" fill="#F7B32B"/><text x="208" y="42" font-size="18" text-anchor="middle" fill="#1E2142" font-family="Arial" font-weight="700">E</text><circle cx="30" cy="150" r="16" fill="#FF7A45"/><text x="30" y="157" font-size="18" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">$</text><circle cx="210" cy="150" r="16" fill="#8E5CF7"/><path d="M203 150 h14 M210 143 v14" stroke="#FFFFFF" stroke-width="4"/></svg></div><div class="tiles"><button class="tile" data-x><span class="h"><i>01</i>المستوى الاقتصادي</span><span class="d" hidden>لدى المجتمعات الأكثر ثراءً فرص أفضل في تبني تقنيات جديدة مقارنة بالمجتمعات الفقيرة. ومن الشائع أيضاً أن تتوافر في المناطق العامة في المجتمعات الغنية بنية تحتية مجانية للوصول إلى الإنترنت على عكس المناطق الفقيرة حيث تزداد الحاجة إليها هناك أكثر.</span></button><button class="tile" data-x><span class="h"><i>02</i>التعليم</span><span class="d" hidden>تشير الدراسات إلى أن أولئك الحاصلين على شهادة جامعية يستطيعون الوصول إلى الإنترنت بمقدار 10 أضعاف مقارنة بالحاصلين على التعليم الثانوي فقط.</span></button><button class="tile" data-x><span class="h"><i>03</i>الموقع الجغرافي</span><span class="d" hidden>تتوفر أجهزة الحاسب للأسر التي تعيش في المناطق الحضرية وضواحيها في منازلهم بنسبة تتجاوز عشرة أضعاف توفرها لدى الأسر الموجودة في المناطق الريفية. ويمكن التغلب على هذه المسألة من خلال الحلول البديلة كاستخدام خطوط الكهرباء والاتصالات عبر الأقمار الاصطناعية التي أصبحت توفر الآن إمكانات جديدة للوصول إلى الإنترنت دون الحاجة إلى إنشاء خطوط هاتفية.</span></button><button class="tile" data-x><span class="h"><i>04</i>الاحتياجات الخاصة</span><span class="d" hidden>قد تتوفر التقنية الحديثة لبعض الأشخاص، ولكن وجود إعاقة من نوع ما قد تمنعهم من استخدام هذه التقنية بشكل كامل. ووفقاً للأبحاث فإن حوالي 15% من التعداد السكاني للعالم يعيشون بنوع من الإعاقة، ويجد 2% إلى 4% صعوبة واضحة في أداء نشاطاتهم اليومية بشكل مستقل.</span></button><button class="tile" data-x><span class="h"><i>05</i>العمر</span><span class="d" hidden>يعد معظم كبار السن بعيدين نوعاً ما عن التقنية مقارنة بالأجيال الشابة، كما أنهم يحتاجون إلى بعض التدريب والتأهيل وذلك من خلال أفراد الأسرة وباستخدام أدوات تسهل عليهم التعامل مع التقنية.</span></button><button class="tile" data-x><span class="h"><i>06</i>اللغة</span><span class="d" hidden>تؤثر اللغة بشكل مباشر في تجربة المستخدم في التعامل مع الإنترنت، فهي تحكم كمّ وجودة المعلومات التي يمكنه الوصول إليها، والمجتمعات التي يمكنه التواصل معها. مثلاً قد يعطيك بحث Google معلومات محددة بلغة معينة أكثر بعشرة أضعاف مما قد تحصل عليه عند البحث بلغة أخرى.</span></button></div></section><section class="slide" data-stage="learn" data-title="نشاط: صِلي العامل بالدليل" data-time="180"><div class="tags"><span class="tag st">استراتيجية: المطابقة في مجموعات</span><span class="tag ev">تقويم تكويني</span><span class="tag tm">3 دقائق • مجموعات</span></div><h2>صِلي العامل بالدليل<small>اضغطي على العامل ثم على الدليل المناسب له • المطابقات الصحيحة: <span class="score">0 / 6</span></small></h2><div class="match"><div class="col a"><button class="chip" data-k="1">المستوى الاقتصادي</button><button class="chip" data-k="2">التعليم</button><button class="chip" data-k="3">الموقع الجغرافي</button><button class="chip" data-k="4">الاحتياجات الخاصة</button><button class="chip" data-k="5">العمر</button><button class="chip" data-k="6">اللغة</button></div><div class="col b"><button class="chip" data-k="5">يحتاجون التدريب والتأهيل من خلال أفراد الأسرة</button><button class="chip" data-k="3">الحضر أكثر من الريف بعشرة أضعاف في توفر الحاسب</button><button class="chip" data-k="6">بحث Google قد يعطي معلومات أكثر بعشرة أضعاف حسب لغة البحث</button><button class="chip" data-k="1">بنية تحتية مجانية للإنترنت في المناطق العامة بالمجتمعات الغنية</button><button class="chip" data-k="4">حوالي 15% من سكان العالم يعيشون بنوع من الإعاقة</button><button class="chip" data-k="2">الجامعيون يصلون للإنترنت بمقدار 10 أضعاف</button></div></div></section><section class="slide" data-stage="learn" data-title="ما الذي يمكن فعله لسد الفجوة؟" data-time="120"><div class="tags"><span class="tag st">استراتيجية: العصف الذهني</span><span class="tag ev">تقويم تكويني</span><span class="tag tm">دقيقتان • جماعي</span></div><h2>ما الذي يمكن فعله لسد الفجوة؟<small>نناقش ذلك سوياً.. كل طالبة تقترح فكرة، ثم نكشف ما ورد في الدرس</small></h2><div><button class="btn soft" data-reveal="gap-a" data-l1="اكشفي حلول الدرس">اكشفي حلول الدرس</button></div><div class="grid two" id="gap-a" hidden><div class="panel pos"><h3>تدريس المهارات الحاسوبية</h3></div><div class="panel pos"><h3>إعادة تدوير وصيانة الأجهزة المستعملة</h3></div></div></section><section class="slide" data-stage="learn" data-title="لنراجع ما تعلمناه اليو
