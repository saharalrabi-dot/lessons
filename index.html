<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>دروسي في التقنية الرقمية</title>
<style>
:root{--paper:#FBF6F9;--card:#fff;--ink:#1E2142;--muted:#5D5F7A;--line:#EADCE4;--berry:#C92A68;--berry-soft:#FBE3ED}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;line-height:1.7;direction:rtl}
.home{max-width:60rem;margin:0 auto;padding:2rem 16px;display:flex;flex-direction:column;gap:1.3rem}
h1,h2,h3{font-family:"El Messiri",serif;margin:0;line-height:1.3}
h1{font-size:clamp(1.8rem,5vw,2.8rem)} h2{color:var(--berry);font-size:1.3rem}
.sub{color:var(--muted)}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:1.1rem 1.2rem;display:flex;flex-direction:column;gap:.8rem}
.meta{font-size:.85rem;color:var(--muted)}
.pers{display:grid;gap:.6rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,14rem),1fr))}
.per{font:inherit;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;background:var(--berry-soft);border:2px solid transparent;border-radius:12px;padding:.7rem .9rem;color:var(--ink)}
.per:hover,.per:focus-visible{border-color:var(--berry);outline:none}
.per b{font-family:"El Messiri",serif;font-size:1.1rem;color:var(--berry)}
.per:nth-child(1){background:#FFE3EF} .per:nth-child(1) b{color:#E5337A} .per:nth-child(2){background:#E1EDFF} .per:nth-child(2) b{color:#2F80ED} .per:nth-child(3){background:#DDF7EF} .per:nth-child(3) b{color:#1FB58F}
.per:nth-child(1):hover{border-color:#E5337A} .per:nth-child(2):hover{border-color:#2F80ED} .per:nth-child(3):hover{border-color:#1FB58F}
h1{background:linear-gradient(90deg,#E5337A,#8E5CF7,#2F80ED);-webkit-background-clip:text;background-clip:text;color:transparent}
.lesson{border-top:6px solid #F7B32B}
body{background:radial-gradient(circle at 95% 5%,rgba(247,179,43,.2) 0 8rem,transparent 8.1rem),radial-gradient(circle at 5% 95%,rgba(47,128,237,.15) 0 10rem,transparent 10.1rem),#FFF8FB}
.hero{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap} .hero svg{width:min(14rem,60vw);height:auto} .per span{font-size:.85rem;color:var(--muted)}
.view{position:fixed;inset:0;display:none;flex-direction:column;background:var(--paper)}
.view.on{display:flex}
.back{font:inherit;cursor:pointer;border:0;background:var(--ink);color:#fff;padding:.35rem 1rem;border-radius:0 0 0 12px;align-self:flex-start;font-size:.85rem}
iframe{flex:1;border:0;width:100%}
</style></head><body>
<div class="home">
<header class="hero"><div><h1>دروسي في التقنية الرقمية</h1><p class="sub">تقنية رقمية 1-1 • الصف الأول الثانوي • يعمل في أي متصفح، بلا تسجيل دخول وبلا صوت</p></div><svg viewBox="0 0 240 180" role="img" aria-label="عوامل الفجوة الرقمية حول العالم" xmlns="http://www.w3.org/2000/svg"><circle cx="120" cy="90" r="64" fill="#2F80ED"/><path d="M80 50 q20 10 18 30 q-2 18 -22 22 q-10 -20 4 -52z M130 40 q30 10 40 40 q-20 0 -30 -12 q-10 -14 -10 -28z M120 120 q20 -6 34 8 q-10 18 -30 22 q-10 -14 -4 -30z" fill="#1FB58F"/><ellipse cx="120" cy="90" rx="64" ry="22" fill="none" stroke="#FFFFFF" stroke-width="2" opacity=".7"/><path d="M120 26 v128" stroke="#FFFFFF" stroke-width="2" opacity=".7"/><rect x="10" y="20" width="44" height="30" rx="8" fill="#E5337A"/><text x="32" y="42" font-size="18" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">ع</text><rect x="186" y="20" width="44" height="30" rx="8" fill="#F7B32B"/><text x="208" y="42" font-size="18" text-anchor="middle" fill="#1E2142" font-family="Arial" font-weight="700">E</text><circle cx="30" cy="150" r="16" fill="#FF7A45"/><text x="30" y="157" font-size="18" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">$</text><circle cx="210" cy="150" r="16" fill="#8E5CF7"/><path d="M203 150 h14 M210 143 v14" stroke="#FFFFFF" stroke-width="4"/></svg></header>
<h2>الوحدة الأولى: أساسيات علم الحاسب</h2>
<article class="lesson"><h3>الدرس الخامس: تقنية المعلومات والاتصالات والمجتمع</h3><span class="meta">الكتاب ص59–67 • ثلاث حصص</span>
<div class="pers"><button class="per" data-i="0"><b>الحصة الأولى</b><span>تأثير التقنية على قطاع الأعمال • لعبة سُلّم الوظائف</span></button><button class="per" data-i="1"><b>الحصة الثانية</b><span>الحياة أسهل • التعلم مدى الحياة • الدفع • المحفظة الرقمية</span></button><button class="per" data-i="2"><b>الحصة الثالثة</b><span>التخزين السحابي • الفجوة الرقمية • جسر الفجوة</span></button></div></article>
</div>
<div class="view"><button class="back">← العودة لقائمة الدروس</button><iframe allow="fullscreen" allowfullscreen title="الحصة"></iframe></div>
<script type="text/plain" id="css">:root{
--paper:#FBF6F9; --card:#FFFFFF; --ink:#1E2142; --muted:#5D5F7A; --line:#EADCE4;
--berry:#C92A68; --berry-soft:#FBE3ED; --mint:#178F7C; --mint-soft:#DDF3EE;
--sun:#E9A22B; --sun-soft:#FDF0D6; --sky:#3260C9; --sky-soft:#E2EAFB; --bad:#C2372F; --bad-soft:#FBE1DF;
--f-display:"El Messiri","Tajawal",serif; --f-body:"IBM Plex Sans Arabic","Tajawal","Segoe UI",Tahoma,sans-serif;
color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:clamp(17px,1.45vw,25px);line-height:1.75;direction:rtl;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible,.box:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.3;margin:0;text-wrap:balance}
p{margin:0}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto}
.rail{display:flex;align-items:center;gap:1rem;padding:.55rem 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.rail .course{font-size:.72em;color:var(--muted);white-space:nowrap}
.rail .course b{color:var(--ink);font-weight:600}
.stages{display:flex;gap:.35rem;flex-wrap:wrap;margin-inline-start:auto}
.stages span{font-size:.68em;padding:.15rem .7rem;border-radius:99px;background:var(--paper);color:var(--muted);border:1px solid var(--line);transition:.2s}
.stages span.on{background:var(--berry);color:#fff;border-color:var(--berry)}
.stages span.done{color:var(--mint);border-color:var(--mint-soft);background:var(--mint-soft)}
.deck{position:relative;overflow:hidden}
.slide{position:absolute;inset:0;overflow-y:auto;padding-block:clamp(1rem,3vh,2.4rem);padding-inline:max(16px,5vw);display:none;flex-direction:column;gap:1.1rem}
.slide.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:.4;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tags{display:flex;gap:.45rem;flex-wrap:wrap;align-items:center}
.tag{font-size:.66em;font-weight:600;padding:.12rem .65rem;border-radius:6px;letter-spacing:.01em}
.tag.st{background:var(--berry-soft);color:var(--berry)}
.tag.ev{background:var(--sky-soft);color:var(--sky)}
.tag.tm{background:var(--sun-soft);color:#8a5a0c}
.tag.bk{background:var(--mint-soft);color:var(--mint)}
.slide h2{font-size:2em;color:var(--ink)}
.slide h2 small{display:block;font-family:var(--f-body);font-size:.42em;color:var(--muted);font-weight:500;margin-top:.2rem}
.lead{font-size:1.15em;max-width:52ch}
.note{font-size:.78em;color:var(--muted)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr))}
.grid.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,22rem),1fr))}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem 1.2rem;min-width:0}
.panel h3{font-size:1.15em;margin-bottom:.35rem}
.panel.pos{border-top:5px solid var(--mint)} .panel.neg{border-top:5px solid var(--berry)}
.list{margin:0;padding-inline-start:1.2rem;display:flex;flex-direction:column;gap:.45rem}
.book{display:flex;gap:1rem;align-items:flex-start;background:var(--mint-soft);border:2px dashed var(--mint);border-radius:14px;padding:1rem 1.2rem}
.book .ico{font-family:var(--f-display);font-size:1.6em;line-height:1;background:var(--mint);color:#fff;border-radius:10px;padding:.35rem .6rem;white-space:nowrap}
.book b{color:var(--mint)}
.btn{border:0;border-radius:10px;padding:.45rem 1.1rem;background:var(--ink);color:#fff;font-weight:600}
.btn.soft{background:var(--berry-soft);color:var(--berry)}
.btn.ok{background:var(--mint)}
.btn:disabled{opacity:.4;cursor:default}
.answer{background:var(--sun-soft);border-radius:10px;padding:.6rem 1rem;border-inline-start:5px solid var(--sun)}
.cover{justify-content:center;align-items:flex-start;gap:1.3rem}
.cover .kicker{font-size:.85em;color:var(--berry);font-weight:600}
.cover h1{font-size:clamp(2.2rem,6vw,5.2rem);max-width:14ch}
.cover .meta{display:flex;gap:.6rem;flex-wrap:wrap}
.cover .meta span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.2rem .8rem;font-size:.8em}
.cover .plan{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem}
.cover .plan span{font-size:.75em;padding:.25rem .8rem;border-radius:99px;background:var(--ink);color:#fff}
.cover .plan span:nth-child(even){background:var(--berry)}
.goals{counter-reset:g;display:flex;flex-direction:column;gap:.8rem;max-width:46rem}
.goals li{list-style:none;display:flex;gap:1rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:.8rem 1.1rem;font-size:1.15em}
.goals li::before{counter-increment:g;content:counter(g);font-family:var(--f-display);font-size:1.4em;color:#fff;background:var(--berry);border-radius:10px;min-width:2.2em;text-align:center}
.lesson-title{font-size:clamp(2rem,4.5vw,3.6rem);color:var(--berry)}
.flip{perspective:900px;min-height:9rem;border:0;background:none;padding:0;text-align:inherit}
.flip .in{position:relative;height:100%;min-height:9rem;transition:transform .55s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;padding:1rem 1.1rem;display:flex;flex-direction:column;justify-content:center;gap:.3rem}
.flip .f{background:var(--card);border:2px solid var(--line)}
.flip .b{background:var(--ink);color:#fff;transform:rotateY(180deg)}
.flip .f small,.flip .b small{font-size:.7em;opacity:.75}
.flip .f .q{font-size:1.05em;font-weight:600}
.sorter{display:grid;gap:1rem}
.pool{display:flex;flex-wrap:wrap;gap:.6rem;min-height:3rem}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:.45rem .9rem;font-size:.85em;text-align:start;max-width:100%}
.chip.sel{border-color:var(--sky);background:var(--sky-soft)}
.chip.good{border-color:var(--mint);background:var(--mint-soft);cursor:default}
.chip.shake{animation:shake .4s;border-color:var(--bad);background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr))}
.bin{border:3px dashed var(--line);border-radius:16px;padding:.8rem;min-height:8rem;display:flex;flex-direction:column;gap:.5rem;background:var(--card);cursor:pointer;text-align:start}
.bin h3{font-size:1.1em}
.bin.pos{border-color:var(--mint)} .bin.neg{border-color:var(--berry)}
.score{font-weight:700;color:var(--berry)}
.votes{display:grid;gap:.7rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,13rem),1fr))}
.vote{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.7rem .9rem;display:flex;flex-direction:column;gap:.5rem}
.vote b{font-size:1.05em}
.vote .opts{display:flex;gap:.4rem}
.vote .opts button{flex:1;border:2px solid var(--line);background:var(--paper);border-radius:9px;padding:.2rem;font-size:.85em}
.vote .opts button.up.on{background:var(--mint);border-color:var(--mint);color:#fff}
.vote .opts button.down.on{background:var(--berry);border-color:var(--berry);color:#fff}
.boxes{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,8rem),1fr))}
.box{aspect-ratio:1/1;max-width:100%;border:0;border-radius:16px;background:var(--berry);color:#fff;font-family:var(--f-display);font-size:2.6em;box-shadow:0 6px 0 #8f1c49;transition:transform .15s}
.box:hover{transform:translateY(-3px)}
.box:nth-child(3n+2){background:var(--sky);box-shadow:0 6px 0 #1f3f8a}
.box:nth-child(3n){background:var(--sun);box-shadow:0 6px 0 #a26e12}
.box.used{background:var(--line);box-shadow:none;color:var(--muted)}
.stagebox{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:1rem 1.3rem;display:flex;flex-direction:column;gap:.7rem}
.stagebox .q{font-size:1.25em;font-weight:600}
.wheel-wrap{display:flex;gap:2rem;align-items:center;flex-wrap:wrap}
.wheel-box{position:relative;width:min(22rem,80vw);aspect-ratio:1/1}
.wheel{width:100%;height:100%;border-radius:50%;border:8px solid var(--ink);transition:transform 3.2s cubic-bezier(.17,.67,.2,1);position:relative}
.wheel span{position:absolute;inset:0;display:flex;justify-content:center;padding-top:6%;font-family:var(--f-display);font-size:1.7em;color:#fff}
.pin{position:absolute;top:-14px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);z-index:2}
.match{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.match .col{display:flex;flex-direction:column;gap:.55rem;min-width:0}
.match .chip{width:100%}
.match .chip.paired{cursor:default}
.fill p{font-size:1.1em;line-height:2.3}
.blank{display:inline-block;min-width:7em;border-bottom:3px solid var(--sky);text-align:center;cursor:pointer;color:var(--sky);font-weight:700;padding-inline:.4rem}
.blank.sel{background:var(--sky-soft)}
.blank.good{border-color:var(--mint);color:var(--mint);cursor:default}
.bank{display:flex;flex-wrap:wrap;gap:.5rem}
.tiles{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:.8rem 1rem;text-align:start;display:flex;flex-direction:column;gap:.35rem}
.tile .h{display:flex;gap:.6rem;align-items:center;font-family:var(--f-display);font-size:1.2em}
.tile .h i{font-style:normal;background:var(--berry);color:#fff;border-radius:8px;padding:0 .55rem;font-size:.85em}
.tile .d{font-size:.85em;color:var(--muted)}
.tile.on{border-color:var(--berry)}
.guide{width:100%;border-collapse:separate;border-spacing:0 .5rem}
.guide td,.guide th{padding:.5rem .8rem;text-align:start;vertical-align:middle}
.guide th{font-size:.75em;color:var(--muted);font-weight:600}
.guide td{background:var(--card);border-block:1px solid var(--line)}
.guide td:first-child{border-inline-start:1px solid var(--line);border-radius:0 12px 12px 0}
.guide td:last-child{border-inline-end:1px solid var(--line);border-radius:12px 0 0 12px}
.yn{display:flex;gap:.35rem}
.yn button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:.1rem .7rem;font-size:.8em;white-space:nowrap}
.yn button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.verdict{font-weight:700} .verdict.y{color:var(--mint)} .verdict.n{color:var(--berry)}
.scroll-x{overflow-x:auto}
.game{display:grid;gap:1.2rem;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:start}
@media (max-width:820px){.game{grid-template-columns:1fr}}
.qcard{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:1.1rem 1.3rem;display:flex;flex-direction:column;gap:.8rem}
.qcard .qn{font-size:.75em;color:var(--muted)}
.qcard .qt{font-size:1.3em;font-weight:700;line-height:1.5}
.qcard .turn{font-size:.85em;font-weight:700}
.opts-g{display:flex;flex-direction:column;gap:.55rem}
.opts-g button{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:.55rem 1rem;text-align:start}
.opts-g button:hover:not(:disabled){border-color:var(--sky)}
.opts-g button.right{background:var(--mint);border-color:var(--mint);color:#fff}
.opts-g button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.opts-g button:disabled{cursor:default}
.feedback{font-weight:700;min-height:1.6em}
.feedback.y{color:var(--mint)} .feedback.n{color:var(--bad)}
.visual{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:.7rem;align-items:center}
.visual h3{font-size:1.1em}
.ladders{display:flex;gap:1.5rem;justify-content:center;width:100%}
.ladder{display:flex;flex-direction:column;align-items:center;gap:.3rem}
.ladder .name{font-weight:700}
.rungs{display:flex;flex-direction:column-reverse;gap:.3rem;border-inline:6px solid var(--ink);padding:.3rem .5rem;border-radius:4px}
.rung{width:5.5rem;height:2rem;border-radius:6px;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.75em;color:var(--muted)}
.rung.top{border-style:dashed;border-color:var(--sun)}
.ladder.a .rung.on{background:var(--berry);border-color:var(--berry);color:#fff}
.ladder.b .rung.on{background:var(--sky);border-color:var(--sky);color:#fff}
.ladder .pts{font-family:var(--f-display);font-size:1.6em}
.wallet{width:100%;max-width:20rem;aspect-ratio:1.58/1;border-radius:18px;background:linear-gradient(135deg,var(--ink),#3a3f78);color:#fff;padding:1rem 1.2rem;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.wallet::after{content:"";position:absolute;width:9rem;height:9rem;border-radius:50%;background:var(--berry);opacity:.35;left:-2rem;bottom:-3rem}
.wallet .chipc{width:2.6rem;height:2rem;border-radius:6px;background:var(--sun)}
.wallet .bal{font-family:var(--f-display);font-size:2.4em;font-variant-numeric:tabular-nums;position:relative;z-index:1}
.wallet .lbl{font-size:.75em;opacity:.8;position:relative;z-index:1}
.wallet.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.06)}}
.goalbar{width:100%;height:.8rem;background:var(--paper);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.goalbar i{display:block;height:100%;background:var(--mint);width:0;transition:width .4s}
.receipt{width:100%;font-size:.75em;color:var(--muted);display:flex;flex-direction:column;gap:.1rem;max-height:7rem;overflow:auto}
.chasm{width:100%;display:grid;grid-template-columns:3.5rem 1fr 3.5rem;align-items:end;height:12rem}
.cliff{height:100%;border-radius:10px 10px 0 0;background:var(--mint);display:flex;align-items:flex-start;justify-content:center;padding-top:.4rem;font-size:.7em;color:#fff;font-weight:700;text-align:center}
.cliff.l{background:var(--muted)}
.gap{height:100%;position:relative;background:linear-gradient(var(--sky-soft),var(--card))}
.planks{position:absolute;top:0;inset-inline:0;display:grid;gap:3px;padding-inline:2px}
.plank{height:1.2rem;background:var(--line);border-radius:3px;opacity:.35;transition:.3s}
.plank.on{background:var(--sun);opacity:1;box-shadow:0 3px 0 #a26e12}
.plank.wob{animation:shake .4s}
.walker{position:absolute;top:-2.2rem;font-size:1.6em;transition:inset-inline-start .5s}
.bar{display:flex;align-items:center;gap:.6rem;padding:.5rem 16px;border-top:1px solid var(--line);background:var(--card);flex-wrap:wrap}
.bar .nav{display:flex;gap:.4rem}
.bar .count{font-variant-numeric:tabular-nums;font-size:.8em;color:var(--muted);min-width:4rem;text-align:center}
.bar .title{font-size:.8em;color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{position:absolute;top:0;inset-inline:0;height:4px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--berry);transition:width .3s}
.timer{display:flex;align-items:center;gap:.4rem;font-variant-numeric:tabular-nums}
.timer .t{font-family:var(--f-display);font-size:1.15em;min-width:3.2em;text-align:center}

.stages span:nth-child(5).on{background:var(--c4);border-color:var(--c4)} .stages span:nth-child(6).on{background:var(--c3);border-color:var(--c3);color:var(--ink)}
.prog i{background:linear-gradient(90deg,var(--c1),var(--c3),var(--c4),var(--c2),var(--c5))}
.tag.st{background:#FFE3EF;color:#B0175A} .tag.ev{background:#E1EDFF;color:#1B5FC2} .tag.tm{background:#FFF0CC;color:#8a5a0c} .tag.bk{background:#DDF7EF;color:#0F7E62}

.box:nth-child(6n+4){background:var(--c4);box-shadow:0 6px 0 #127a5f}.box:nth-child(6n+5){background:var(--c5);box-shadow:0 6px 0 #5b33ad}.box:nth-child(6n){background:var(--c6);box-shadow:0 6px 0 #b34d22}

.flip .f{border-width:3px} .grid .flip:nth-child(4n+1) .f{border-color:var(--c1)} .grid .flip:nth-child(4n+2) .f{border-color:var(--c2)} .grid .flip:nth-child(4n+3) .f{border-color:var(--c4)} .grid .flip:nth-child(4n) .f{border-color:var(--c6)}
.grid .flip:nth-child(4n+1) .b{background:var(--c1)} .grid .flip:nth-child(4n+2) .b{background:var(--c2)} .grid .flip:nth-child(4n+3) .b{background:var(--c4)} .grid .flip:nth-child(4n) .b{background:var(--c5)}
.qcard{border-color:var(--ac,var(--ink));box-shadow:0 8px 0 var(--ac,var(--ink))}
.btn{background:var(--ac,var(--ink))}
.bar .btn{background:var(--ink)}
.stages span{cursor:pointer;font-weight:600}

.jump{font:inherit;font-size:.72em;max-width:min(100%,18rem);padding:.2rem .5rem;border-radius:9px;border:2px solid var(--c5);background:#F3EEFF;color:var(--ink);cursor:pointer}</script>
<script type="text/plain" id="js">(function(){
const STAGES={review:"مراجعة الدرس السابق",warm:"نشاط تمهيدي",goals:"العنوان والأهداف",learn:"الشرح",close:"النشاط الختامي",task:"المهام والواجب"};
const order=["review","warm","goals","learn","close","task"];
const slides=[...document.querySelectorAll('.slide')];
const stagesEl=document.querySelector('.stages');
const present=order.filter(s=>slides.some(x=>x.dataset.stage===s));
stagesEl.innerHTML=present.map(s=>`<span role="button" tabindex="0" data-s="${s}" title="انتقلي إلى ${STAGES[s]}">${STAGES[s]}</span>`).join('');
const jump=document.createElement('select');jump.className='jump';jump.setAttribute('aria-label','انتقلي إلى صفحة');
jump.innerHTML=slides.map((x,i)=>`<option value="${i}">${i+1}. ${(x.dataset.title||'').replace(/</g,'&lt;')}</option>`).join('');
stagesEl.after(jump);
stagesEl.addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;go(slides.findIndex(x=>x.dataset.stage===b.dataset.s))});
stagesEl.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.dataset.s){e.preventDefault();e.target.click()}});
jump.addEventListener('change',()=>{go(+jump.value);jump.blur()});
const prog=document.querySelector('.prog i'),count=document.querySelector('.count'),ttl=document.querySelector('.bar .title');
let cur=0;
const timerEl=document.querySelector('.timer'),tT=timerEl.querySelector('.t'),tBtn=timerEl.querySelector('button');
let tLeft=0,tInt=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function resetTimer(){clearInterval(tInt);tInt=null;timerEl.classList.remove('done');const t=+slides[cur].dataset.time||0;tLeft=t;timerEl.hidden=!t;tT.textContent=fmt(t);tBtn.textContent='ابدئي المؤقت'}
tBtn.onclick=()=>{if(tInt){clearInterval(tInt);tInt=null;tBtn.textContent='استئناف';return}
if(tLeft<=0)resetTimer();tBtn.textContent='إيقاف';tInt=setInterval(()=>{tLeft--;tT.textContent=fmt(Math.max(tLeft,0));if(tLeft<=0){clearInterval(tInt);tInt=null;timerEl.classList.add('done');tBtn.textContent='إعادة'}},1000)};
function go(i){
cur=Math.max(0,Math.min(slides.length-1,i));
slides.forEach((s,k)=>s.classList.toggle('on',k===cur));
const st=slides[cur].dataset.stage,si=present.indexOf(st);
stagesEl.querySelectorAll('span').forEach((e,k)=>{e.classList.toggle('on',k===si);e.classList.toggle('done',k<si)});
prog.style.width=((cur+1)/slides.length*100)+'%';
count.textContent=(cur+1)+' / '+slides.length;
ttl.textContent=slides[cur].dataset.title||'';
const j=document.querySelector('.jump');if(j)j.value=cur;
slides[cur].scrollTop=0;resetTimer();
slides[cur].dispatchEvent(new Event('show'));
}
document.querySelector('[data-nav=next]').onclick=()=>go(cur+1);
document.querySelector('[data-nav=prev]').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select'))return;
if(e.key==='ArrowLeft'||e.key==='PageDown'){go(cur+1);e.preventDefault()}
if(e.key==='ArrowRight'||e.key==='PageUp'){go(cur-1);e.preventDefault()}});
const fs=document.querySelector('[data-fs]');
fs.onclick=()=>{try{if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{})}else{document.exitFullscreen().catch(()=>{})}}catch(e){}};
/* flip & reveal & tiles */
document.addEventListener('click',e=>{
const f=e.target.closest('.flip');if(f){f.classList.toggle('on');return}
const r=e.target.closest('[data-reveal]');if(r){const t=document.getElementById(r.dataset.reveal);t.hidden=!t.hidden;r.textContent=t.hidden?(r.dataset.l1||'أظهري الإجابة'):(r.dataset.l2||'إخفاء');return}
const tl=e.target.closest('.tile[data-x]');if(tl){tl.classList.toggle('on');const d=tl.querySelector('.d');d.hidden=!d.hidden}
});
/* sorter */
document.querySelectorAll('.sorter').forEach(S=>{
let sel=null;const chips=[...S.querySelectorAll('.pool .chip')],sc=S.querySelector('.score');
const upd=()=>{if(sc)sc.textContent=S.querySelectorAll('.bin .chip').length+' / '+chips.length};upd();
chips.forEach(c=>c.onclick=()=>{if(c.classList.contains('good'))return;chips.forEach(x=>x.classList.remove('sel'));sel=c;c.classList.add('sel')});
S.querySelectorAll('.bin').forEach(b=>b.onclick=e=>{if(!sel||e.target.closest('.chip'))return;
if(sel.dataset.bin===b.dataset.bin){sel.classList.remove('sel');sel.classList.add('good');b.appendChild(sel);sel=null;upd()}
else{const s=sel;s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')}});
});
/* votes (shared store for later comparison) */
window.VOTES={};
document.querySelectorAll('.vote').forEach(v=>{v.querySelectorAll('.opts button').forEach(b=>b.onclick=()=>{
const on=!b.classList.contains('on');v.querySelectorAll('.opts button').forEach(x=>x.classList.remove('on'));
if(on){b.classList.add('on');VOTES[v.dataset.k]=b.classList.contains('up')?'+':'-'}else delete VOTES[v.dataset.k]})});
/* mystery boxes */
document.querySelectorAll('.boxes').forEach(B=>{
const data=JSON.parse(document.getElementById(B.dataset.src).textContent),out=document.getElementById(B.dataset.out);
B.innerHTML=data.map((d,i)=>`<button class="box" data-i="${i}" aria-label="صندوق ${i+1}">${i+1}</button>`).join('');
B.onclick=e=>{const b=e.target.closest('.box');if(!b)return;b.classList.add('used');const d=data[b.dataset.i];
out.hidden=false;out.innerHTML=`<span class="note">صندوق ${+b.dataset.i+1}</span><p class="q">${d.q}</p><div><button class="btn soft" data-reveal="mb-a">أظهري الإجابة</button></div><div class="answer" id="mb-a" hidden>${d.a}</div>`};
});
/* wheel */
document.querySelectorAll('[data-wheel]').forEach(W=>{
const data=JSON.parse(document.getElementById(W.dataset.wheel).textContent),n=data.length,wh=W.querySelector('.wheel'),out=W.querySelector('.stagebox');
const cols=['var(--berry)','var(--sky)','var(--sun)','var(--mint)','#7a4fc0','#e0663a'];
wh.style.background='conic-gradient('+data.map((_,i)=>`${cols[i%cols.length]} ${i*360/n}deg ${(i+1)*360/n}deg`).join(',')+')';
wh.innerHTML=data.map((_,i)=>`<span style="transform:rotate(${(i+.5)*360/n}deg)">${i+1}</span>`).join('');
let rot=0,used=new Set();
W.querySelector('[data-spin]').onclick=()=>{let k;const left=[...Array(n).keys()].filter(i=>!used.has(i));if(!left.length){used.clear();return}
k=left[Math.floor(Math.random()*left.length)];used.add(k);
const target=360-((k+.5)*360/n);rot+=1440+((target-rot%360)+360)%360;wh.style.transform=`rotate(${rot}deg)`;out.hidden=true;
setTimeout(()=>{out.hidden=false;out.innerHTML=`<span class="note">السؤال ${k+1}</span><p class="q">${data[k].q}</p><div><button class="btn soft" data-reveal="wh-a">أظهري الإجابة</button></div><div class="answer" id="wh-a" hidden>${data[k].a}</div>`},3300)};
});
/* match */
document.querySelectorAll('.match').forEach(M=>{
let pick=null;const cols=['var(--berry)','var(--sky)','var(--sun)','var(--mint)','#7a4fc0','#e0663a'];let c=0;
const sc=M.parentElement.querySelector('.score'),total=M.querySelectorAll('.col.a .chip').length;
M.querySelectorAll('.col.a .chip').forEach(a=>a.onclick=()=>{if(a.classList.contains('paired'))return;M.querySelectorAll('.col.a .chip').forEach(x=>x.classList.remove('sel'));pick=a;a.classList.add('sel')});
M.querySelectorAll('.col.b .chip').forEach(b=>b.onclick=()=>{if(!pick||b.classList.contains('paired'))return;
if(pick.dataset.k===b.dataset.k){const col=cols[c++%cols.length];[pick,b].forEach(x=>{x.classList.remove('sel');x.classList.add('paired');x.style.borderColor=col;x.style.boxShadow=`inset -8px 0 0 ${col}`});pick=null;
if(sc)sc.textContent=M.querySelectorAll('.col.a .paired').length+' / '+total}
else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}});
});
/* fill blanks */
document.querySelectorAll('.fill').forEach(F=>{
let sel=null;const bl=[...F.querySelectorAll('.blank')];
bl.forEach(b=>{b.textContent='؟';b.tabIndex=0;b.onclick=()=>{if(b.classList.contains('good'))return;bl.forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel')}});
F.querySelectorAll('.bank .chip').forEach(w=>w.onclick=()=>{if(!sel||w.classList.contains('good'))return;
if(sel.dataset.a===w.textContent.trim()){sel.textContent=w.textContent;sel.classList.remove('sel');sel.classList.add('good');w.classList.add('good');sel=null}
else{w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}});
});
/* anticipation guide */
window.GUIDE={};
document.querySelectorAll('.yn').forEach(y=>y.querySelectorAll('button').forEach(b=>b.onclick=()=>{y.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');GUIDE[y.dataset.k]=b.dataset.v}));
document.querySelectorAll('[data-guide-after]').forEach(T=>{
const data=JSON.parse(document.getElementById(T.dataset.guideAfter).textContent);
T.closest('.slide').addEventListener('show',()=>{T.innerHTML='<tr><th>العبارة</th><th>رأي الصف قبل الدرس</th><th>بعد الدرس</th></tr>'+data.map(d=>{const g=GUIDE[d.k];const before=g?(g==='y'?'أوافق':'لا أوافق'):'—';
return `<tr><td>${d.s}</td><td>${before}</td><td><span class="verdict ${d.v}">${d.v==='y'?'صحيحة':'غير صحيحة'}</span><div class="note">${d.why}</div></td></tr>`}).join('')});
});
/* vote compare */
document.querySelectorAll('[data-compare]').forEach(T=>{
const data=JSON.parse(document.getElementById(T.dataset.compare).textContent);
T.closest('.slide').addEventListener('show',()=>{let hit=0,n=0;T.innerHTML='<tr><th>المهنة</th><th>توقع الصف</th><th>الكتاب</th><th>التفسير</th></tr>'+data.map(d=>{const v=VOTES[d.k];if(v){n++;if(v===d.v)hit++}
const mark=v?(v===d.v?' ✓':' ✗'):'';return `<tr><td><b>${d.job}</b></td><td>${v?(v==='+'?'إيجاباً':'سلباً')+mark:'—'}</td><td><span class="verdict ${d.v==='+'?'y':'n'}">${d.v==='+'?'إيجاباً (+)':'سلباً (-)'}</span></td><td class="note">${d.why}</td></tr>`}).join('');
const s=T.closest('.slide').querySelector('.cmp-score');if(s)s.textContent=n?`أصاب الصف ${hit} من ${n} توقعات`:'لم تُسجَّل توقعات في النشاط التمهيدي'});
});
/* quiz games */
document.querySelectorAll('.game').forEach(G=>{
const qs=JSON.parse(document.getElementById(G.dataset.src).textContent),mode=G.dataset.game;
const qn=G.querySelector('.qn'),qt=G.querySelector('.qt'),og=G.querySelector('.opts-g'),fb=G.querySelector('.feedback'),nx=G.querySelector('.next'),turn=G.querySelector('.turn'),vis=G.querySelector('.visual');
let i=0,team=0,sc=[0,0],bal=0;const goal=+G.dataset.goal||qs.length;
function draw(){
if(mode==='ladder'){const R=+G.dataset.rungs||5;vis.innerHTML='<h3>سُلّم الوظائف</h3><div class="ladders">'+['أ','ب'].map((t,k)=>`<div class="ladder ${k?'b':'a'}"><span class="name">الفريق ${t}</span><div class="rungs">${[...Array(R)].map((_,r)=>`<div class="rung ${r<sc[k]?'on':''} ${r===R-1?'top':''}">${r===R-1?'القمة':'درجة '+(r+1)}</div>`).join('')}</div><span class="pts">${sc[k]}</span></div>`).join('')+'</div>';
turn.textContent='الدور على: الفريق '+(team?'ب':'أ');turn.style.color=team?'var(--sky)':'var(--berry)'}
if(mode==='wallet'){vis.innerHTML=`<h3>المحفظة الرقمية للصف</h3><div class="wallet"><div class="chipc"></div><div><div class="lbl">الرصيد</div><div class="bal">${bal} ريال</div></div><div class="lbl">الهدف: ${goal*10} ريال</div></div><div class="goalbar"><i style="width:${Math.min(100,bal/(goal*10)*100)}%"></i></div><div class="receipt">${G._log||''}</div>`;turn.textContent=''}
if(mode==='bridge'){const P=goal;vis.innerHTML=`<h3>ابني جسراً فوق الفجوة الرقمية</h3><div class="chasm"><div class="cliff l">بلا إمكانية وصول</div><div class="gap"><div class="planks" style="grid-template-columns:repeat(${P},1fr)">${[...Array(P)].map((_,k)=>`<div class="plank ${k<bal?'on':''}"></div>`).join('')}</div></div><div class="cliff">مجتمع رقمي</div></div><p class="note">ألواح الجسر: ${bal} / ${P}</p>`;turn.textContent=''}
}
function show(){
if(i>=qs.length){end();return}
const q=qs[i];qn.textContent='السؤال '+(i+1)+' من '+qs.length;qt.textContent=q.q;fb.textContent='';fb.className='feedback';nx.hidden=true;
const idx=q.o.map((_,k)=>k);for(let k=idx.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[idx[k],idx[j]]=[idx[j],idx[k]]}
og.innerHTML=idx.map(k=>`<button data-k="${k}">${q.o[k]}</button>`).join('');draw();
}
og.onclick=e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const q=qs[i],ok=+b.dataset.k===0;
og.querySelectorAll('button').forEach(x=>{x.disabled=true;if(+x.dataset.k===0)x.classList.add('right')});if(!ok)b.classList.add('wrong');
fb.textContent=ok?'إجابة صحيحة!':'ليست هذه.. الإجابة الصحيحة مظللة بالأخضر';fb.className='feedback '+(ok?'y':'n');
if(ok){if(mode==='ladder')sc[team]++;else{bal+=mode==='wallet'?10:1;if(mode==='wallet')G._log=`<span>✔ السؤال ${i+1}: +10 ريال</span>`+(G._log||'')}}
if(mode==='ladder')team=1-team;
draw();if(ok&&mode==='wallet'){const w=G.querySelector('.wallet');w&&w.classList.add('pop')}
if(!ok&&mode==='bridge'){const p=G.querySelectorAll('.plank')[bal];p&&p.classList.add('wob')}
if(q.w){fb.textContent+=' — '+q.w}
nx.hidden=false;nx.textContent=i===qs.length-1?'النتيجة':'السؤال التالي';
};
nx.onclick=()=>{i++;show()};
function end(){qn.textContent='انتهت اللعبة';og.innerHTML='';nx.hidden=true;draw();
if(mode==='ladder')qt.textContent=sc[0]===sc[1]?'تعادل! أحسنتما يا فريقين':'الفوز للفريق '+(sc[0]>sc[1]?'أ':'ب')+' 🎉';
if(mode==='wallet')qt.textContent='رصيد الصف النهائي: '+bal+' ريال';
if(mode==='bridge')qt.textContent=bal>=goal?'اكتمل الجسر! عبرنا الفجوة الرقمية 🎉':'بُني '+bal+' من '+goal+' ألواح';
fb.innerHTML='<button class="btn soft" data-restart>إعادة اللعبة</button>'}
G.addEventListener('click',e=>{if(e.target.closest('[data-restart]')){i=0;team=0;sc=[0,0];bal=0;G._log='';show()}});
show();
});
go(0);
})();</script>

ass="q">هل يفهم الحاسب النص أو الصورة أو الفيديو؟</span></div><div class="b"><small>للمعلمة</small>ناقشي الإجابات واستمعي لأكبر عدد من الطالبات</div></div></button><button class="flip"><div class="in"><div class="f"><small>سؤال 2</small><span class="q">هل يدرك الحاسب لغة البشر؟</span></div><div class="b"><small>للمعلمة</small>اطلبي من الطالبة تبرير إجابتها</div></div></button><button class="flip"><div class="in"><div class="f"><small>سؤال 3</small><span class="q">إذن.. ماذا يفهم الحاسب؟</span></div><div class="b"><small>للمعلمة</small>اربطي الإجابة بما تعلمته الطالبات في الدرس السابق</div></div></button></div></section><section class="slide" data-stage="warm" data-title="نشاط تمهيدي: صعود أم هبوط؟" data-time="180"><div class="tags"><span class="tag st">استراتيجية: التصويت الصفي وتنشيط المعرفة السابقة</span><span class="tag ev">تقويم تشخيصي</span><span class="tag tm">3 دقائق • جماعي</span></div><h2>صعود أم هبوط؟<small>هل تأثرت هذه المهن إيجاباً أم سلباً بالتقنية؟ صوّتي مع زميلاتك، وسجّلي رأي الأغلبية. سنكشف الإجابة في آخر الحصة!</small></h2><div class="votes"><div class="vote" data-k="web"><b>مصمم المواقع الإلكترونية</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="shop"><b>عامل المتجر</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="bank"><b>موظفو البنوك</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="sa"><b>محلل الأنظمة</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="prog"><b>مبرمج جهاز الحاسب</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="office"><b>الموظف المكتبي</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="eng"><b>مهندس جهاز الحاسب</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="tel"><b>عامل بدالة الهاتف</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div><div class="vote" data-k="lib"><b>موظف المكتبة</b><div class="opts"><button class="up">▲ إيجاباً</button><button class="down">▼ سلباً</button></div></div></div><p class="note">سؤال للنقاش: هل تعتقدين أن لتقنية المعلومات والاتصالات تأثيراً على أماكن العمل؟</p></section><section class="slide" data-stage="goals" data-title="عنوان الدرس وأهداف الحصة"><span class="note">الدرس الخامس • الحصة الأولى</span><h1 class="lesson-title">تقنية المعلومات والاتصالات والمجتمع</h1><h2 style="font-size:1.3em">أهداف الحصة الأولى</h2><ol class="goals"><li>معرفة تأثير تقنية المعلومات والاتصالات على قطاع الأعمال (الإيجابيات والتحديات).</li><li>تعداد الآثار الرئيسية الثلاثة لإدخال التقنية إلى قطاع الأعمال.</li><li>تصنيف المهن التي تأثرت إيجاباً أو سلباً بالتقنية مع التفسير.</li></ol></section><section class="slide" data-stage="learn" data-title="مقدمة: التقنية وأماكن العمل"><div class="tags"><span class="tag st">استراتيجية: العرض المباشر والأسئلة الموجهة</span><span class="tag bk">الكتاب ص59</span></div><div class="split"><div class="txt"><h2>التقنية وأماكن العمل</h2><p class="lead">لم يعد سرًّا أن التقنية أصبحت ذات تأثير كبير على طريقة ومدة وبيئة العمل وكذلك مدى كفاءته.</p><p class="lead">أدرك أصحاب الشركات والمصانع الفوائد العظيمة لاستخدام أجهزة الحاسب، فدربوا موظفيهم على مهارات استخدامها، ونتج عن ذلك تغييرات جذرية في كيفية قيام هؤلاء الموظفين بممارسة وظائفهم.</p><p class="lead">لقد أثرت تقنية المعلومات والاتصالات <b>(ICT)</b> على قطاع الأعمال <b style="color:var(--mint)">إيجاباً</b> ولكن هناك <b style="color:var(--berry)">تحديات</b> في حياة الناس العملية في جميع المجالات.</p></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="موظفون يستخدمون التقنية في العمل" xmlns="http://www.w3.org/2000/svg"><circle cx="200" cy="30" r="22" fill="#F7B32B" opacity=".9"/><rect x="20" y="120" width="200" height="10" rx="4" fill="#1E2142"/><rect x="40" y="62" width="74" height="50" rx="6" fill="#2F80ED"/><rect x="46" y="68" width="62" height="36" rx="3" fill="#FFFFFF"/><rect x="52" y="74" width="20" height="24" fill="#E5337A"/><rect x="76" y="84" width="10" height="14" fill="#1FB58F"/><rect x="90" y="78" width="10" height="20" fill="#F7B32B"/><rect x="70" y="112" width="14" height="8" fill="#1E2142"/><g transform="translate(160,66) scale(1)"><rect x="-16" y="18" width="32" height="40" rx="14" fill="#E5337A"/><circle cx="0" cy="6" r="13" fill="#F2C6A0"/><path d="M-14 4 Q-14 -10 0 -10 Q14 -10 14 4 Q10 -4 0 -4 Q-10 -4 -14 4Z" fill="#1E2142"/></g><rect x="128" y="96" width="40" height="26" rx="4" fill="#8E5CF7"/><circle cx="148" cy="109" r="5" fill="#FFFFFF"/><path d="M30 40 l12 -12 l12 12 l12 -12" stroke="#1FB58F" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div></div><div class="panel hl"><h3>سؤال موجّه</h3><p>فكّري في عمل أحد أفراد أسرتك: ما المهارات التقنية التي يحتاجها اليوم ولم يكن يحتاجها من قبل؟</p></div></section><section class="slide" data-stage="learn" data-title="الإيجابيات والتحديات"><div class="tags"><span class="tag st">استراتيجية: العرض المباشر</span><span class="tag bk">الكتاب ص59</span></div><div class="split"><div class="txt"><h2>تأثير تقنية المعلومات والاتصالات على قطاع الأعمال</h2><p class="lead">جدول الإيجابيات والتحديات كما ورد في الكتاب.</p></div><div class="art sm"><svg viewBox="0 0 240 180" role="img" aria-label="إيجابيات وتحديات" xmlns="http://www.w3.org/2000/svg"><circle cx="80" cy="90" r="58" fill="#1FB58F"/><circle cx="165" cy="90" r="50" fill="#E5337A"/><path d="M58 98 h16 v30 h-16z M78 128 h34 q8 0 9 -8 l6 -30 q1 -8 -8 -8 h-22 l4 -18 q2 -12 -8 -14 l-15 30z" fill="#FFFFFF"/><path d="M146 82 h14 v-26 h-14z M163 56 h30 q7 0 8 7 l5 26 q1 7 -7 7 h-19 l3 15 q2 10 -7 12 l-13 -26z" fill="#FFFFFF"/></svg></div></div><div class="grid two"><div class="panel pos"><h3 style="color:var(--mint)">الإيجابيات</h3><ul class="list"><li>زادت من سرعة وكفاءة إنجاز الأعمال بشكل كبير.</li><li>بعض المهام مثل تدوين الملاحظات والعصف الذهني تصبح أسهل مع استخدام التقنيات الجديدة.</li><li>تعمل مؤتمرات الفيديو وغيرها من التقنيات الجديدة للاتصال على تحسين التفاعل بين الموظفين.</li><li>يمكن للموظفين العمل عن بعد دون الحاجة إلى الذهاب إلى أماكن عملهم، حيث يعمل هذا على توفير الوقت والموارد.</li></ul></div><div class="panel neg"><h3 style="color:var(--berry)">التحديات</h3><ul class="list"><li>ليس من السهل دائماً تعلم التقنيات الجديدة خاصة بالنسبة لكبار السن الذين يتفاعلون بشكل أقل مع التقنية.</li><li>قد يتعرض الموظفون المكتبيون لتشتت انتباههم بسبب البريد الإلكتروني أو رسائل المحادثة الفورية أو المكالمات الهاتفية أو غيرها.</li><li>قد تسبب اللغة المكتوبة (عبر رسائل البريد الإلكتروني) حدوث سوء فهم، خاصة إذا كان المرسل أو المرسل إليه على غير معرفة كافية بهذه اللغة، حيث يتميز التواصل المباشر دائماً بوضوح التعبير.</li><li>يتسبب الاستخدام المفرط للتقنية ببعض المشاكل الصحية مثل ضعف الرؤية ومشاكل العضلات والعظام وأمراض القلب.</li></ul></div></div></section><section class="slide" data-stage="learn" data-title="نشاط: ميزان التقنية" data-time="180"><div class="tags"><span class="tag st">استراتيجية: التعلم التعاوني (فكّري، زاوجي، شاركي)</span><span class="tag ev">تقويم تكويني</span><span class="tag tm">3 دقائق • ثنائي</span></div><h2>ميزان التقنية<small>اضغطي على العبارة ثم على الكفة المناسبة. هل ترجح كفة الإيجابيات أم التحديات؟</small></h2><div class="sorter"><div class="pool"><button class="chip" data-bin="neg">تشتت انتباه الموظفين بسبب البريد الإلكتروني والمحادثات الفورية</button><button class="chip" data-bin="pos">زيادة سرعة وكفاءة إنجاز الأعمال</button><button class="chip" data-bin="neg">صعوبة تعلم التقنيات الجديدة لكبار السن</button><button class="chip" data-bin="pos">تحسين التفاعل بين الموظفين بمؤتمرات الفيديو</button><button class="chip" data-bin="neg">سوء الفهم في الرسائل المكتوبة</button><button class="chip" data-bin="pos">العمل عن بعد يوفر الوقت والموارد</button><button class="chip" data-bin="neg">ضعف الرؤية ومشاكل العضلات والعظام</button><button class="chip" data-bin="pos">تدوين الملاحظات والعصف الذهني أسهل</button></div><div class="bins"><div class="bin pos" data-bin="pos"><h3 style="color:var(--mint)">كفة الإيجابيات</h3></div><div class="bin neg" data-bin="neg"><h3 style="color:var(--berry)">كفة التحديات</h3></div></div><p>العبارات الموزعة: <span class="score"></span></p></div></section><section class="slide" data-stage="learn" data-title="الآثار الرئيسية الثلاثة"><div class="tags"><span class="tag st">استراتيجية: الحوار والمناقشة</span><span class="tag ev">تقويم تكويني</span></div><div class="split"><div class="txt"><h2>ترتب على إدخال التقنية إلى قطاع الأعمال ثلاثة آثار رئيسية<small>اضغطي على كل أثر، ثم اطلبي من الطالبات ذكر أمثلة</small></h2></div><div class="art sm"><svg viewBox="0 0 240 180" role="img" aria-label="الآثار الثلاثة" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="90" r="40" fill="#E5337A"/><text x="60" y="104" font-size="44" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">a</text><circle cx="120" cy="70" r="40" fill="#FF7A45"/><text x="120" y="84" font-size="44" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">b</text><circle cx="180" cy="90" r="40" fill="#2F80ED"/><text x="180" y="104" font-size="44" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">c</text></svg></div></div><div class="grid"><button class="flip"><div class="in"><div class="f"><small>الأثر a</small><span class="q">إلغاء بعض الوظائف والاستغناء عن العاملين بها</span></div><div class="b"><small>اذكري أمثلة ؟</small>من وظيفة ألغيت أو قلّ العاملون بها بسبب التقنية</div></div></button><button class="flip"><div class="in"><div class="f"><small>الأثر b</small><span class="q">استحداث وظائف جديدة بسبب وجود الحاجة للعامل البشري لإنشاء أو إدارة أنظمة أجهزة الحاسب</span></div><div class="b"><small>اذكري أمثلة ؟</small>وظيفة جديدة ظهرت مع التقنية</div></div></button><button class="flip"><div class="in"><div class="f"><small>الأثر c</small><span class="q">الحاجة لتدريب وتأهيل الموظفين ليكونوا قادرين على استخدام التقنية</span></div><div class="b"><small>اذكري أمثلة ؟</small>مهارة تقنية يحتاج الموظف أن يتدرب عليها</div></div></button></div><div class="book"><span class="ico">الكتاب</span><p>افتحي كتابك على <b>صفحة 60</b>، واقرئي الفقرة التي تتحدث عن الآثار الرئيسية لإدخال التقنية إلى قطاع الأعمال. <b>ضعي خطاً تحت الآثار الثلاثة</b> في كتابك.</p></div></section><section class="slide" data-stage="learn" data-title="وظائف تأثرت إيجاباً"><div class="tags"><span class="tag st">استراتيجية: القراءة الموجهة</span><span class="tag bk">الكتاب</span></div><div class="split"><div class="txt"><h2 style="color:var(--mint)">أمثلة على الوظائف التي تأثرت إيجاباً بسبب التقنية</h2></div><div class="art sm"><svg viewBox="0 0 240 180" role="img" aria-label="وظائف تأثرت إيجاباً" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="40" width="120" height="84" rx="8" fill="#2F80ED"/><rect x="38" y="48" width="104" height="66" rx="4" fill="#FFFFFF"/><path d="M50 100 l20 -22 l16 12 l26 -30 l18 14" stroke="#1FB58F" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="78" y="124" width="24" height="10" fill="#1E2142"/><rect x="60" y="134" width="60" height="6" rx="3" fill="#1E2142"/><circle cx="185" cy="70" r="30" fill="#1FB58F"/><path d="M185 55 v30 M170 70 h30" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/><path d="M180 120 l12 -16 l12 16z" fill="#F7B32B"/><rect x="188" y="118" width="8" height="22" fill="#F7B32B"/></svg></div></div><div class="scroll-x"><table class="guide"><tr><th>الوظيفة</th><th>ماذا تفعل؟</th></tr><tr><td><b>مصمم المواقع الإلكترونية</b><div class="note" dir="ltr" style="text-align:right">Web Designer</div></td><td>يصمّم المواقع الإلكترونية التجارية أو الشخصية.</td></tr><tr><td><b>محلل الأنظمة</b><div c /div><div class="stagebox" id="mb2-out" hidden></div></section><section class="slide" data-stage="warm" data-title="نشاط تمهيدي: قبل وبعد" data-time="180"><div class="tags"><span class="tag st">استراتيجية: التوقع والاستنتاج</span><span class="tag ev">تقويم تشخيصي</span><span class="tag tm">3 دقائق • جماعي</span></div><h2>قبل التقنية.. وبعدها!<small>اقرئي الموقف، وتوقعي كيف أصبح بعد التقنية، ثم اقلبي البطاقة</small></h2><div class="grid two"><button class="flip"><div class="in"><div class="f"><small>🛒 قبل</small><span class="q">أحتاج شراء غرض.. كيف أشتريه اليوم؟</span></div><div class="b"><small>بعد التقنية</small>التسوق من منازلنا، كما أنها تعرض أسعاراً أفضل في كثير من الأحوال</div></div></button><button class="flip"><div class="in"><div class="f"><small>🎓 قبل</small><span class="q">أريد حضور دورة لمحاضر مشهور في مدينة بعيدة..</span></div><div class="b"><small>بعد التقنية</small>أضحى بالإمكان حضور الدورات التدريبية عبر الإنترنت ومشاهدة المدرسين والمحاضرين</div></div></button><button class="flip"><div class="in"><div class="f"><small>🎮 قبل</small><span class="q">ألعب ألعاب الفيديو.. مع من؟</span></div><div class="b"><small>بعد التقنية</small>اللعب التشاركي عبر الإنترنت مع أشخاص حقيقيين آخرين حول العالم</div></div></button><button class="flip"><div class="in"><div class="f"><small>💳 قبل</small><span class="q">أريد دفع ثمن مشترياتي.. كيف؟</span></div><div class="b"><small>بعد التقنية</small>طرق دفع جديدة عبر الإنترنت توفر راحة وسهولة في الدفع</div></div></button></div></section><section class="slide" data-stage="goals" data-title="عنوان الدرس وأهداف الحصة"><span class="note">الدرس الخامس • الحصة الثانية</span><h1 class="lesson-title">تقنية المعلومات والاتصالات والمجتمع</h1><h2 style="font-size:1.3em">أهداف الحصة الثانية</h2><ol class="goals"><li>توضيح كيف أصبحت الحياة بالتقنية أسهل وأفضل.</li><li>معرفة مفهوم التعلم مدى الحياة ومتطلباته.</li><li>معرفة تطور عمليات دفع الأموال.</li></ol></section><section class="slide" data-stage="learn" data-title="بالتقنية الحياة أسهل وأفضل"><div class="tags"><span class="tag st">استراتيجية: العرض المباشر</span><span class="tag bk">الكتاب ص61</span></div><h2>بالتقنية الحياة أسهل وأفضل</h2><p class="lead">إن توفر المزيد من التقنيات الجديدة غيّر حياتنا للأفضل، وسهّل علينا أموراً كثيرة منها:</p><div class="grid"><div class="panel"><h3>🛒 منصات التجارة الإلكترونية</h3><p>نتسوق من منازلنا بأسعار أفضل في كثير من الأحوال.</p></div><div class="panel"><h3>🎓 منصات التعليم الإلكتروني</h3><p>نحضر الدورات التدريبية عبر الإنترنت في أي وقت.</p></div><div class="panel"><h3>🎮 ألعاب الفيديو</h3><p>ألعاب تعليمية وترفيهية تشحذ العقل وتنمي التفكير المنطقي.</p></div></div><p class="note">سنتعرف على كل مجال بالتفصيل في الصفحات التالية.</p></section><section class="slide" data-stage="learn" data-title="منصات التجارة الإلكترونية"><div class="tags"><span class="tag st">استراتيجية: الربط بالواقع</span><span class="tag bk">الكتاب ص61</span></div><div class="split"><div class="txt"><h2>🛒 منصات التجارة الإلكترونية</h2><p class="lead">أصبحت منصات <b>التجارة الإلكترونية</b> تتيح لنا شراء المنتجات بسرعة ودون عناء ومن منازلنا. كما أن هذه المتاجر عبر الإنترنت تعرض أسعاراً أفضل في كثير من الأحوال.</p></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="تسوق إلكتروني" xmlns="http://www.w3.org/2000/svg"><rect x="70" y="20" width="100" height="150" rx="16" fill="#1E2142"/><rect x="78" y="34" width="84" height="120" rx="6" fill="#FFFFFF"/><rect x="86" y="44" width="30" height="30" rx="4" fill="#F7B32B"/><rect x="124" y="44" width="30" height="30" rx="4" fill="#1FB58F"/><rect x="86" y="82" width="30" height="30" rx="4" fill="#2F80ED"/><rect x="124" y="82" width="30" height="30" rx="4" fill="#8E5CF7"/><rect x="90" y="124" width="60" height="18" rx="9" fill="#E5337A"/><text x="120" y="137" font-size="11" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-weight="700">BUY</text><path d="M180 90 h12 l10 40 h40" stroke="#FF7A45" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="194" y="100" width="40" height="22" rx="4" fill="#FF7A45"/><circle cx="204" cy="142" r="6" fill="#1E2142"/><circle cx="228" cy="142" r="6" fill="#1E2142"/><circle cx="35" cy="60" r="18" fill="#F7B32B"/><text x="35" y="67" font-size="20" text-anchor="middle" fill="#1E2142" font-family="Arial" font-weight="700">%</text></svg></div></div><h3 style="font-size:1.1em">من أمثلة منصات التجارة الإلكترونية</h3><div class="grid" dir="ltr" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,9rem),1fr))"><div class="panel"><h3>Shopify</h3></div><div class="panel"><h3>BigCommerce</h3></div><div class="panel"><h3>Magento</h3></div><div class="panel"><h3>CS-Cart</h3></div><div class="panel"><h3>WooCommerce</h3></div><div class="panel"><h3>PrestaShop</h3></div><div class="panel"><h3>Zen Cart</h3></div><div class="panel"><h3>OpenCart</h3></div></div><div class="panel hl"><h3>اذكري أمثلة؟</h3><p>ما المتجر الإلكتروني الذي اشترت منه أسرتك مؤخراً؟ وما الميزة التي جعلتكم تفضلونه؟</p></div></section><section class="slide" data-stage="learn" data-title="منصات التعليم الإلكتروني"><div class="tags"><span class="tag st">استراتيجية: القراءة الفعالة</span><span class="tag bk">الكتاب ص61</span></div><div class="split"><div class="txt"><h2>🎓 منصات التعليم الإلكتروني</h2><p class="lead">إن تطور التقنية والإنترنت، كظهور الأجهزة اللوحية وتقنية مؤتمرات الفيديو المنخفضة التكلفة، عمل أيضاً على تغيير طريقة تعليم الناس وتعلمهم. لقد تحولت وتطورت سُبل التعليم حيث وفّرت منصات <b>التعليم الإلكتروني</b> إمكانية التعلم، وأضحى بإمكانك حضور الدورات التدريبية عبر الإنترنت ومشاهدة المدرسين والمحاضرين يلقون المحاضرات حول الكثير من الموضوعات.</p></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="تعليم إلكتروني" xmlns="http://www.w3.org/2000/svg"><rect x="20" y="30" width="150" height="100" rx="10" fill="#2F80ED"/><rect x="28" y="38" width="134" height="84" rx="4" fill="#FFFFFF"/><g transform="translate(70,62) scale(0.8)"><rect x="-16" y="18" width="32" height="40" rx="14" fill="#E5337A"/><circle cx="0" cy="6" r="13" fill="#F2C6A0"/><path d="M-14 4 Q-14 -10 0 -10 Q14 -10 14 4 Q10 -4 0 -4 Q-10 -4 -14 4Z" fill="#1E2142"/></g><rect x="100" y="56" width="52" height="34" rx="4" fill="#F7B32B"/><path d="M108 66 h36 M108 74 h28 M108 82 h32" stroke="#1E2142" stroke-width="3"/><path d="M122 108 l14 -8 v16z" fill="#E5337A"/><rect x="80" y="130" width="30" height="10" fill="#1E2142"/><rect x="60" y="140" width="70" height="6" rx="3" fill="#1E2142"/><path d="M190 60 l30 -14 l30 14 l-30 14z" fill="#8E5CF7"/><path d="M200 66 v18 q20 12 40 0 v-18" fill="#8E5CF7" opacity=".75"/><circle cx="205" cy="130" r="20" fill="#1FB58F"/><path d="M196 130 l6 6 l12 -12" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round"/></svg></div></div><div class="grid two"><div class="panel pos"><h3>مجاني في كثير من الأحيان</h3><p>تتوفر فرص التعليم الإلكتروني بشكل مجاني في كثير من الأحيان، ولذلك فهو يُعد أيضاً فرصة عظيمة للأشخاص الذين لا يستطيعون دفع تكاليف تعليمهم.</p></div><div class="panel pos"><h3>بالوتيرة التي تناسبك</h3><p>يمتاز التعليم الإلكتروني بإمكانية الحصول على المعلومات والمعارف العلمية بالوتيرة التي تناسبك وفي أي وقت يناسبك أيضاً، وقد مكّن هذا الكثير من الموظفين من مواصلة تعلمهم خارج ساعات الدوام.</p></div></div></section><section class="slide" data-stage="learn" data-title="ألعاب الفيديو"><div class="tags"><span class="tag st">استراتيجية: الحوار والمناقشة</span><span class="tag bk">الكتاب ص61</span></div><div class="split"><div class="txt"><h2>🎮 ألعاب الفيديو</h2><p class="lead">تُضفي <b>ألعاب الفيديو</b> تأثيراً تقنياً إيجابياً على حياتنا أيضاً، حيث إنه بفضل التطور في أنظمة جهاز الحاسب، ظهرت الكثير من الألعاب التعليمية وكذلك الترفيهية التي تشحذ العقل وتنمي التفكير المنطقي.</p></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="ألعاب الفيديو" xmlns="http://www.w3.org/2000/svg"><rect x="30" y="60" width="180" height="80" rx="40" fill="#8E5CF7"/><rect x="62" y="88" width="34" height="12" rx="3" fill="#FFFFFF"/><rect x="73" y="77" width="12" height="34" rx="3" fill="#FFFFFF"/><circle cx="160" cy="84" r="9" fill="#F7B32B"/><circle cx="180" cy="100" r="9" fill="#1FB58F"/><circle cx="140" cy="100" r="9" fill="#2F80ED"/><circle cx="160" cy="116" r="9" fill="#E5337A"/><rect x="60" y="20" width="22" height="22" rx="3" fill="#1FB58F"/><rect x="90" y="30" width="22" height="22" rx="3" fill="#F7B32B"/><rect x="120" y="14" width="22" height="22" rx="3" fill="#FF7A45"/><circle cx="190" cy="34" r="10" fill="#F7B32B"/><circle cx="210" cy="24" r="6" fill="#F7B32B"/></svg></div></div><div class="grid two"><div class="panel pos"><h3>اللعب التشاركي</h3><p>تتجه الكثير من ألعاب الفيديو بشكل متزايد إلى اللعب التشاركي مع أفراد آخرين في المجتمع أو حتى حول العالم، فيكون لعبها عبر الإنترنت مع أشخاص حقيقيين آخرين بدلاً من جهاز الحاسب. يوفر هذا النوع من اللعب مزيداً من فرص التواصل الاجتماعي ومشاركة الأنشطة مع أشخاص ذوي اهتمامات مشتركة من جميع أنحاء العالم.</p></div><div class="panel neg"><h3>الاعتدال مهم!</h3><p>كما هو الحال مع جميع الأشياء، فإن الاعتدال يُعد أمراً مهماً فيما يتعلق بألعاب الفيديو؛ لأنه من السهل جداً الاندماج في لعبة معينة وإدمان العالم الرقمي.</p></div></div><div class="panel hl"><h3>ناقشي</h3><p>اذكري لعبة تعليمية تنمي التفكير المنطقي.. وكم ساعة ترين أنها مناسبة للعب يومياً؟</p></div></section><section class="slide" data-stage="learn" data-title="مواقع الدورات الإلكترونية"><div class="tags"><span class="tag st">استراتيجية: التعلم بالأمثلة الواقعية</span><span class="tag bk">الكتاب ص61</span></div><h2>تحققي من بعض الدورات الإلكترونية المتوفرة على هذه المواقع</h2><div class="grid"><div class="panel"><h3>منصة دروب</h3><p dir="ltr" style="text-align:right">https://doroob.sa</p></div><div class="panel"><h3>منصة إثرائي</h3><p dir="ltr" style="text-align:right">https://ethrai.sa</p></div><div class="panel"><h3>منصة رواق</h3><p dir="ltr" style="text-align:right">https://www.rwaq.org</p></div></div><div class="panel hl"><h3>حدّثيني عن ذلك!!</h3><p>هل جرّبتِ إحدى هذه المنصات؟ أو تعلّمتِ مهارة جديدة عبر الإنترنت؟ شاركي زميلتك بجانبك ثم الصف.</p></div></section><section class="slide" data-stage="learn" data-title="نشاط من الكتاب: حدّدي المجال" data-time="120"><div class="tags"><span class="tag st">استراتيجية: القراءة الفعالة</span><span class="tag ev">تقويم تكويني</span><span class="tag bk">الكتاب ص61</span><span class="tag tm">دقيقتان • فردي</span></div><h2>اقرئي ص61 وضعي المصطلح المناسب</h2><div class="book"><span class="ico">ص61</span><p>اقرئي فقرات «بالتقنية الحياة أسهل وأفضل» في كتابك، ثم اكتبي في دفترك: <b>ما المجال الذي تصفه كل عبارة؟</b></p></div><div class="grid"><button class="flip"><div class="in"><div class="f"><small>العبارة 1</small><span class="q">«... تشحذ العقل وتنمي التفكير المنطقي»</span></div><div class="b"><small>المجال</small>ألعاب الفيديو</div></div></button><button class="flip"><div class="in"><div class="f"><small>العبارة 2</small><span class="q">«... فرصة عظيمة للأشخاص الذين لا يستطيعون دفع تكاليف تعليمهم»</span></div><div class="b"><small>المجال</small>التعليم (الدورات عبر الإنترنت)</div></div></button><button class="flip"><div class="in"><div class="f"><small>العبارة 3</small><span class="q">«... من منازلنا، كما أنها تعرض أسعاراً أفضل»</span></div><div class="b"><small>المجال</small>التسوق</div></div></button></div></section><section class="slide" data-stage="learn" data-title="دور التقنية في تسهيل التعلم مدى الحياة"><div class="tags"><span class="tag st">استراتيجية: العرض المباشر</span><span class="tag bk">الكتاب ص61</span></div><div class="split"><div class="txt"><h2>دور التقنية في تسهيل التعلم مدى الحياة</h2><div class="answer" style="font-size:1.1em"><b>التعلم مدى الحياة</b> هو عملية اكتساب المعرفة والمهارات خلال حياتنا، وغالباً ما يساعد هذا النوع من التعلم على إتقان عملنا. ويمكن أن تدعم التقنية المتعلمين في الوصول بسرعة إلى المعرفة والمهارات الجديدة.</div></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="التعلم مدى الحياة" xmlns="http://www.w3.org/2000/svg"><path d="M30 150 h180" stroke="#1E2142" stroke-width="4"/><rect x="40" y="120" width="40" height="30" fill="#E5337A"/><rect x="80" y="96" width="40" height="54" fill="#FF7A45"/><rect x="120" y="72" width="40" height="78" fill="#F7B32B"/><rect x="160" y="48" width="40" height="102" fill="#1FB58F"/><g transform="translate(180,6) scale(0.85)"><rect x="-16" y="18" width="32" height="40" rx="14" fill="#8E5CF7"/><circle cx="0" cy="6" r="13" fill="#F2C6A0"/><path d="M-14 4 Q-14 -10 0 -10 Q14 -10 14 4 Q10 -4 0 -4 Q-10 -4 -14 4Z" fill="#1E2142"/></g><circle cx="60" cy="56" r="22" fill="#F7B32B"/><rect x="53" y="76" width="14" height="10" rx="2" fill="#1E2142"/><path d="M60 22 v-8 M32 32 l-6 -6 M88 32 l6 -6 M26 56 h-8 M94 56 h8" stroke="#F7B32B" stroke-width="4" stroke-linecap="round"/></svg></div></div><div class="grid two"><div class="panel"><p>التعلم مدى الحياة يتطلب التحفيز الذاتي. يجب أن تشعر بالرضا عن التعلم وعن قدرتك على التعلم.</p></div><div class="panel"><p>يتطلب التعلم الفعّال أن تحصل على المعلومات من خلال القراءة والاستماع والمراقبة والممارسة والتجربة والخبرة. المعلومات في كل مكان من حولك لذا عليك السعي للحصول على المعلومات التي تفيدك وتطور قدراتك ومهاراتك.</p></div><div class="panel"><p>يمكن للتقنية أن تسد الفجوة بين الوقت الذي تعلمت فيه، وأين ومتى يمكنك تطبيق ما تعلمته. فباستخدامها يمكنك الوصول السريع إلى المعلومات في أي وقت.</p></div><div class="panel"><p>الأجهزة المحمولة والحوسبة السحابية تقنيات يمكن استخدامها لدعم التعلم مدى الحياة.</p></div><div class="panel"><p>يمكن أيضاً استخدام الحوسبة السحابية للتشجيع على التعاون حيث تمكن المتعلمين من مشاركة المواد.</p></div><div class="panel"><p>يكون التعلم ناجحاً عندما تتمكن من البحث عن معنى شخصي للمعلومات التي تكتسبها.</p></div><div class="panel"><p>ينبغي عليك التفكير في التعلم الخاص بك. فكر كيف ولماذا تعلمت؟ وما شعرت به حول موضوع معين أو موقف معين قبل وبعد تطوير معرفتك.</p></div></div><div class="book"><span class="ico">ص61</span><p>اقرئي في الكتاب <b>صفحة 61</b> وضعي خطاً تحت تعريف <b>التعلم مدى الحياة</b>، ثم اكتبيه بأسلوبك في دفترك.</p></div></section><section class="slide" data-stage="learn" data-title="نشاط: أكملي الفراغ" data-time="120"><div class="tags"><span class="tag st">استراتيجية: بنك الكلمات</span><span class="tag ev">تقويم تكويني</span><span class="tag tm">دقيقتان • فردي</span></div><h2>أكملي عبارات التعلم مدى الحياة<small>اضغطي على الفراغ، ثم على الكلمة المناسبة من البنك</small></h2><div class="fill"><p>• التعلم مدى الحياة يتطلب <span class="blank" data-a="التحفيز"></span> الذاتي.</p><p>• يتطلب التعلم الفعّال أن تحصل على المعلومات من خلال القراءة والاستماع والمراقبة و<span class="blank" data-a="الممارسة"></span> والتجربة والخبرة.</p><p>• يمكن للتقنية أن تسد <span class="blank" data-a="الفجوة"></span> بين الوقت الذي تعلمت فيه، وأين ومتى يمكنك تطبيق ما تعلمته.</p><p>• الأجهزة المحمولة و<span class="blank" data-a="الحوسبة السحابية"></span> تقنيات يمكن استخدامها لدعم التعلم مدى الحياة.</p><p>• يكون التعلم ناجحاً عندما تتمكن من البحث عن <span class="blank" data-a="معنى شخصي"></span> للمعلومات التي تكتسبها.</p><div class="bank" style="margin-top:1rem"><button class="chip">الحوسبة السحابية</button><button class="chip">معنى شخصي</button><button class="chip">التحفيز</button><button class="chip">الفجوة</button><button class="chip">الممارسة</button></div></div></section><section class="slide" data-stage="learn" data-title="تطور عمليات دفع الأموال"><div class="tags"><span class="tag st">استراتيجية: فكّري، زاوجي، شاركي</span><span class="tag ev">تقويم تكويني</span><span class="tag bk">الكتاب ص62</span></div><div class="split"><div class="txt"><h2>تطور عمليات دفع الأموال</h2><p class="lead">لقد وفر التطور الكبير في التقنية مصدراً مهماً لاعتماد طرق دفع جديدة عبر الإنترنت، فأصبحت تلك الطرق توفر راحة وسهولة في الدفع؛ فعلى سبيل المثال يُمكن للمستهلكين استخدام وسائل دفع جديدة في التطبيقات التي يستخدمونها لسداد تكاليف الشراء مثل: <b dir="ltr">(STC Pay)</b> و <b dir="ltr">(Bayan Pay)</b>.</p></div><div class="art"><svg viewBox="0 0 240 180" role="img" aria-label="دفع إلكتروني" xmlns="http://www.w3.org/2000/svg"><rect x="40" y="18" width="90" height="150" rx="14" fill="#1E2142"/><rect x="48" y="32" width="74" height="120" rx="6" fill="#FFFFFF"/><rect x="56" y="90" width="58" height="36" rx="5" fill="#2F80ED"/><rect x="62" y="98" width="12" height="9" rx="2" fill="#F7B32B"/><path d="M62 116 h40" stroke="#FFFFFF" stroke-width="3"/><path d="M70 52 q15 -14 30 0 M76 60 q9 -8 18 0" stroke="#1FB58F" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="85" cy="68" r="4" fill="#1FB58F"/><rect x="146" y="70" width="80" height="50" rx="8" fill="#E5337A"/><rect x="146" y="82" width="80" height="10" fill="#1E2142"/><rect x="156" y="102" width="30" height="7" rx="3" fill="#FFFFFF"/><circle cx="190" cy="36" r="20" fill="#F7B32B"/><text x="190" y="43" font-size="20" text-anchor="middle" fill="#1E2142" font-family="Arial" font-weight="700">$</text></svg></div></div><div class="panel hl"><p>تتطور المحافظ الإلكترونية التي تدعمها مثل هذه التطبيقات باستمرار، لذا يتوجب عليك أن تكون جاهزاً لقبول طرق الدفع الجديدة قريباً.</p></div><div class="panel"><h3>اذكري أمثلة؟</h3><p>فكّري وحدك دقيقة، ثم ناقشي زميلتك، ثم شاركي الصف: ما وسائل الدفع الإلكتروني التي تستخدمها أسرتك؟</p></div></section><section class="slide" data-stage="learn" data-title="نظام الريبل"><div class="tags"><span class="tag st">استراتيجية: العرض المباشر</span><span class="tag bk">الكتاب ص62</span></div><h2>نظام الريبل <span dir="ltr">(Ripple)</span></h2><p class="lead">يُعد نظام <b>الريبل</b> (Ripple) أحد الحلول الرقمية المصممة للدفع. الريبل هي شبكة دفع عبر الإنترنت متخصصة في المدفوعات المالية الرقمية باستخدام تقنية سلسلة الكتل «البلوكتشين» التي يمكنها تسوية المعاملات في بضع ثوانٍ.</p><div class="answer">كثير من الدول لا يعتمد العملات الرقمية ومنها المملكة العربية السعودية وذلك لمخاطرها العالية في الوقت الحاضر.</div></section><section class="slide" data-stage="learn" data-title="لنراجع ما تعلمناه اليوم"><div class="tags"><span class="tag st">استراتيجية: الخريطة الذهنية</span></div><h2>لنراجع ما تعلمناه اليوم</h2><div class="grid"><div class="panel"><h3>بالتقنية الحياة أسهل وأفضل</h3><p>التسوق • التعليم عبر الإنترنت • ألعاب الفيديو باعتدال</p></div><div class="panel"><h3>التعلم مدى الحياة</h3><p>اكتساب المعرفة والمهارات خلال حياتنا • تحفيز ذاتي • الأجهزة المحمولة والحوسبة السحابية</p></div><div class="panel"><h3>تطور عمليات دفع الأموال</h3><p>طرق دفع جديدة توفر راحة وسهولة • STC Pay و Bayan Pay • نظام الريبل</p></div></div></section><section class="slide" data-stage="close" data-title="لعبة المحفظة الرقمية" data-time="420"><div class="tags"><span class="tag st">استراتيجية: التعلم باللعب (تحدي الصف)</span><span class="tag ev">تقويم ختامي</span><span class="tag tm">7 دقائق • الصف كاملاً</span></div><h2>المحفظة الرقمية<small>كل إجابة صحيحة تودع 10 ريالات في محفظة الصف. هل نصل إلى 100 ريال؟ اختاري طالبة مختلفة لكل سؤال.</small></h2><div class="game" data-game="wallet" data-src="q2" data-goal="10"><div class="qcard"><span class="qn"></span><span class="turn"></span><p class="qt"></p><div class="opts-g"></div><div class="feedback"></div><div><button class="btn next" hidden>التالي</button></div></div><div class="visual"></div></div></section><section class="slide" data-stage="task" data-title="تدريب 1 و3 والتحضير"><div class="tags"><span class="tag st">استراتيجية: التعلم الذاتي والمشاركة</span><span class="tag bk">الكتاب ص65–66</span></div><h2>تدريبات الكتاب والتحضير للحصة القادمة</h2><div class="grid two"><div class="book"><span class="ico">تدريب 1</span><p><b>ص65:</b> اختاري دورة تدريبية عبر الإنترنت من المواقع الإلكترونية المتوفرة في هذا الدرس، واختاري دورة تساعدك على إثراء معرفتك في مجال تقنية المعلومات والاتصالات. شاركي تجربتك مع زميلاتك في الفصل واستمعي إلى تجاربهن أيضاً.</p></div><div class="book" style="background:var(--berry-soft);border-color:var(--berry)"><span class="ico" style="background:var(--berry)">تدريب 3</span><p><b>ص66 • مهمة أدائية:</b> زوري الموقع <span dir="ltr">www.rwaq.org</span>، واضغطي زر «تصفح المواد» وحددي مادة تعجبك (مثل: نحو تعلم رقمي نشط). أكملي الدورة وأجيبي: هل كانت ممتعة ومفيدة؟ وسمّي بعض الأشخاص أو فئات الأشخاص الذين يمكنهم الاستفادة من حضورها.</p></div></div><div class="book"><span class="ico">ص62</span><p>للحصة القادمة: اقرئي في الكتاب من <b>صفحة 62</b> عن «التخزين السحابي» و«الفجوة الرقمية»، وفكّري: <b>هل توجد طرق لحفظ البيانات على الإنترنت؟ ما هي؟</b></p></div><p class="lead">شاكرة لكن حسن استماعكن 🌷</p></section><script type="application/json" id="mb2">[
